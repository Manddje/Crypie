[project]
name = "crypie"
version = "0.1.0"
description = "Crypto trading app for Bitvavo, driven by indicators, news and Claude"
requires-python = ">=3.12"
dependencies = [
    # Floors sit above releases with known vulnerabilities; the exact, hashed versions are in
    # requirements.txt / requirements-dev.txt (generated with uv pip compile, see their header).
    "fastapi>=0.115",
    # Plain uvicorn plus only the extras the app uses (no websockets/watchfiles/PyYAML).
    # 0.31 is the first release that accepts networks (CIDR) in FORWARDED_ALLOW_IPS.
    "uvicorn>=0.31",
    "httptools>=0.6.4",
    "uvloop>=0.21; sys_platform != 'win32' and platform_python_implementation == 'CPython'",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.31",
    "anthropic>=2.3",
    "feedparser>=6.0",
    "segno>=1.6",
    # Transitive (via fastapi / uvicorn, httpx), listed only to keep vulnerable releases out.
    "starlette>=1.3.1",
    "h11>=0.16",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # Depends(...) in defaults is the FastAPI idiom
