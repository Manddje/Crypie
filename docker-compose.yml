# Works locally with `docker compose up` and as a Docker Compose resource in Coolify.
# Coolify injects the variables from its UI; locally they come from .env.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      TRADING_MODE: ${TRADING_MODE:-paper}
      BITVAVO_API_KEY: ${BITVAVO_API_KEY:-}
      BITVAVO_API_SECRET: ${BITVAVO_API_SECRET:-}
      MARKETS: ${MARKETS:-BTC-EUR,ETH-EUR}
      PAPER_START_EUR: ${PAPER_START_EUR:-1000}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DATABASE_URL: postgresql+psycopg://crypie:${POSTGRES_PASSWORD:-crypie}@db:5432/crypie
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: crypie
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crypie}
      POSTGRES_DB: crypie
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crypie -d crypie"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
